version: 2

before:
  hooks:
    - go mod tidy

builds:
    - binary: proxify
      main: cmd/proxify/proxify.go
      env:
        - CGO_ENABLED=0
      goos:
        - linux
        - windows
        - darwin
      goarch:
        - amd64
        - 386
        - arm
        - arm64
      ignore:
        - goos: windows
          goarch: 'arm'
        - goos: windows
          goarch: 'arm64'
      id: proxify

    - binary: replay
      main: cmd/replay/replay.go
      env:
        - CGO_ENABLED=0
      goos:
        - linux
        - windows
        - darwin
      goarch:
        - amd64
        - 386
        - arm
        - arm64
      ignore:
        - goos: windows
          goarch: 'arm'
        - goos: windows
          goarch: 'arm64'
      id: replay

    - binary: mitmrelay
      main: cmd/mitmrelay/mitmrelay.go
      env:
        - CGO_ENABLED=0
      goos:
        - linux
        - windows
        - darwin
      goarch:
        - amd64
        - 386
        - arm
        - arm64
      ignore:
        - goos: windows
          goarch: 'arm'
        - goos: windows
          goarch: 'arm64'
      id: mitmrelay

archives:
- formats: [zip]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'


checksum:
  algorithm: sha256

dockers_v2:
  - images:
      - projectdiscovery/proxify
    ids:
      - proxify
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
      - latest
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.ref.name: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v6
    # NOTE: release-test runs a snapshot on runners without QEMU; only build images
    # in CI on real releases.
    disable: '{{ and .IsSnapshot (isEnvSet "CI") }}'

announce:
  slack:
    enabled: true
    channel: '#release'
    username: GoReleaser
    message_template: 'New Release: {{ .ProjectName }} {{.Tag}} is published! Check it out at {{ .ReleaseURL }}'

  discord:
    enabled: true
    message_template: '**New Release: {{ .ProjectName }} {{.Tag}}** is published! Check it out at {{ .ReleaseURL }}'